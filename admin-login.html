<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SYSTIM</title>

    <link rel="stylesheet" href="admin-login.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <div class="left">

        <img src="image.png" alt="SYSTIM Logo">

        <h1>SYSTIM</h1>

        <p>Administrator Access Portal</p>

        <br>

        <p>
            Manage student concerns, monitor reports, and oversee Campus Pulse operations.
        </p>

    </div>

    <div class="right">

        <div class="login-box">

            <h2>Admin Login 🔐</h2>

            <p>Sign in as Administrator</p>

            <div class="input-group">
                <input type="text"
                id="adminUsername"
                placeholder="👤 Admin Username">
            </div>

            <div class="input-group password-group">

                <input
                type="password"sdfhjkl;''
                id="adminPassword"
                placeholder="🔒 Password">

                <span
                class="toggle-password"
                onclick="togglePassword()">
                👁️
                </span>

            </div>

            <div class="remember">

                <label>
                    <input type="checkbox">
                    Remember Me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <button class="login-btn"
            onclick="adminLogin()">

                Login

            </button>

            <div class="links">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

<script>

function adminLogin(){

    const username =
    document.getElementById("adminUsername").value;

    const password =
    document.getElementById("adminPassword").value;

    if(username === ""){
        alert("Enter admin username.");
        return;
    }

    if(password === ""){
        alert("Enter password.");
        return;
    }

    window.location.href =
    "admin-dashboard.html";

}

function togglePassword(){

    const password =
    document.getElementById("adminPassword");

    const eye =
    document.querySelector(".toggle-password");

    if(password.type === "password"){

        password.type = "text";
        eye.innerHTML = "🙈";

    }else{

        password.type = "password";
        eye.innerHTML = "👁️";

    }
}

</script>

</body>
</html>
